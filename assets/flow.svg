<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="560" viewBox="0 0 1460 560" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="1460" height="560" fill="#ffffff"/>
<text x="730.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#172036">Leaker: ingest once, search everything</text>
<text x="730.0" y="80" text-anchor="middle" font-size="14.5" fill="#5b6b84">clone → launch → drag your data into the drop zone (or link a database) → search from the terminal</text>
<rect x="34" y="110" width="350" height="368" rx="16" fill="#eef3fe" stroke="#2f6fed" stroke-opacity="0.25" stroke-width="1.5"/>
<rect x="34" y="110" width="350" height="46" rx="16" fill="#2f6fed"/>
<rect x="34" y="136" width="350" height="20" fill="#2f6fed"/>
<text x="54" y="140" font-size="17" font-weight="700" fill="#ffffff">1  ·  SOURCES</text>
<text x="54" y="188" font-size="14.5" font-weight="700" fill="#2f6fed" font-family="Menlo, monospace">Drag &amp; drop into  dropzone/</text>
<text x="54" y="218" font-size="14.5" fill="#172036">Stealer logs  .txt / .log</text>
<text x="54" y="247" font-size="14.5" fill="#172036">CSV · TSV · Excel</text>
<text x="54" y="276" font-size="14.5" fill="#172036">PDF · DOCX</text>
<text x="54" y="305" font-size="14.5" fill="#172036">JSON · JSONL · XML</text>
<text x="54" y="334" font-size="14.5" fill="#172036">SQLite · SQL dumps</text>
<text x="54" y="363" font-size="14.5" fill="#172036">Archives  .zip · .tar · .7z</text>
<line x1="54" y1="382" x2="364" y2="382" stroke="#2f6fed" stroke-opacity="0.3"/>
<text x="54" y="400" font-size="13.5" fill="#5b6b84">or link a live DB:</text>
<text x="54" y="422" font-size="13.5" fill="#5b6b84">Postgres · MySQL · Mongo · Redis</text>
<rect x="428" y="110" width="320" height="368" rx="16" fill="#e7f6f3" stroke="#17a398" stroke-opacity="0.25" stroke-width="1.5"/>
<rect x="428" y="110" width="320" height="46" rx="16" fill="#17a398"/>
<rect x="428" y="136" width="320" height="20" fill="#17a398"/>
<text x="448" y="140" font-size="17" font-weight="700" fill="#ffffff">2  ·  EXTRACT + NORMALIZE</text>
<text x="448" y="188" font-size="14.5" font-weight="700" fill="#17a398" font-family="Menlo, monospace">watcher.py, auto</text>
<text x="448" y="218" font-size="14.5" fill="#172036">New files detected on drop</text>
<text x="448" y="247" font-size="14.5" fill="#172036">Archives auto-unpacked</text>
<text x="448" y="276" font-size="14.5" fill="#172036">Per-format parser + regex</text>
<text x="448" y="305" font-size="14.5" fill="#172036">Pulls emails, user:pass,</text>
<text x="448" y="334" font-size="14.5" fill="#172036">phones, hashes</text>
<text x="448" y="363" font-size="14.5" fill="#172036">→ one flat record</text>
<rect x="792" y="110" width="290" height="368" rx="16" fill="#f1edf8" stroke="#8e7cc3" stroke-opacity="0.25" stroke-width="1.5"/>
<rect x="792" y="110" width="290" height="46" rx="16" fill="#8e7cc3"/>
<rect x="792" y="136" width="290" height="20" fill="#8e7cc3"/>
<text x="812" y="140" font-size="17" font-weight="700" fill="#ffffff">3  ·  INDEX</text>
<text x="812" y="188" font-size="14.5" font-weight="700" fill="#8e7cc3" font-family="Menlo, monospace">Elasticsearch</text>
<text x="812" y="218" font-size="14.5" fill="#172036">Bulk index</text>
<text x="812" y="247" font-size="14.5" fill="#172036">Keeps provenance:</text>
<text x="812" y="276" font-size="14.5" fill="#172036">source · line · column</text>
<text x="812" y="305" font-size="14.5" fill="#172036">· table · page</text>
<text x="812" y="334" font-size="14.5" fill="#172036">SHA-256 dedup</text>
<rect x="1126" y="110" width="300" height="368" rx="16" fill="#fdf3e2" stroke="#e9a23b" stroke-opacity="0.25" stroke-width="1.5"/>
<rect x="1126" y="110" width="300" height="46" rx="16" fill="#e9a23b"/>
<rect x="1126" y="136" width="300" height="20" fill="#e9a23b"/>
<text x="1146" y="140" font-size="17" font-weight="700" fill="#ffffff">4  ·  SEARCH</text>
<text x="1146" y="188" font-size="14.5" font-weight="700" fill="#e9a23b" font-family="Menlo, monospace">leak></text>
<text x="1146" y="218" font-size="14.5" fill="#172036">Full-text or exact</text>
<text x="1146" y="247" font-size="14.5" fill="#172036">Filter by type / source</text>
<text x="1146" y="276" font-size="14.5" fill="#172036">Paged results</text>
<text x="1146" y="305" font-size="14.5" fill="#172036">Every hit shows</text>
<text x="1146" y="334" font-size="14.5" fill="#172036">where it came from</text>
<line x1="390" y1="294.0" x2="410" y2="294.0" stroke="#5b6b84" stroke-width="3"/>
<path d="M408,285.0 L422,294.0 L408,303.0 Z" fill="#5b6b84"/>
<line x1="754" y1="294.0" x2="774" y2="294.0" stroke="#5b6b84" stroke-width="3"/>
<path d="M772,285.0 L786,294.0 L772,303.0 Z" fill="#5b6b84"/>
<line x1="1088" y1="294.0" x2="1108" y2="294.0" stroke="#5b6b84" stroke-width="3"/>
<path d="M1106,285.0 L1120,294.0 L1106,303.0 Z" fill="#5b6b84"/>
<text x="730.0" y="536" text-anchor="middle" font-size="14.5" fill="#5b6b84" font-style="italic">No LLM · no API keys · offline · deterministic · exact provenance on every match</text>
</svg>